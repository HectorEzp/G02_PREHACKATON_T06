# Configuración de conexión MySQL (Opción A: Docker local / Opción B: AWS RDS)
# Para AWS RDS cambie localhost por el endpoint de la instancia, por ejemplo:
# db.url=jdbc:mysql://mi-instancia.xxxxxx.us-east-1.rds.amazonaws.com:3306/db_eventos?...
