# Opción A: MySQL local en Docker (puerto 3306)
# Uso:  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db_eventos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # El script se ejecuta automáticamente la primera vez que se crea el contenedor
      - ./sql/db_eventos.sql:/docker-entrypoint-initdb.d/01_db_eventos.sql:ro
volumes:
  mysql_data:
